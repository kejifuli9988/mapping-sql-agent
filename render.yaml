services:
  - type: web
    name: mapping-sql-agent
    runtime: python
    plan: free
    buildCommand: "python --version"
    startCommand: "python webapp.py --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
